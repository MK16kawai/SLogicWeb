<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>logicweb</title>
  <!--
    Declaring an icon is what stops the browser probing /favicon.ico at the DOMAIN root -
    which, for a project page served from a subdirectory, is not this site's to serve and
    404s. Vite rewrites this href with the build's base, so it follows the subdirectory.
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!--
    Pre-paint theme apply: dark is the default theme, so this sets data-theme="dark"
    before the stylesheet loads and no session can flash the light chrome first.
    Mirrors pickTheme() in src/ui/theme.ts: a stored live id wins; absent, garbage,
    and the migrated legacy 'default' pick all land on dark - with today's registry
    every path does. The storage read is real, not decorative: the theme self-test
    (src/ui/tools/theme-selftest.ts) pins the getItem literal so this script and
    pickTheme() cannot drift, and a future added theme id turns the honor check into
    a real branch. A bare inline script on purpose: vite.config.ts's
    inlineEntryForFileOpen only rewrites module scripts and the stylesheet link, so
    this passes the portable single-file build untouched.
  -->
  <script>
    try {
      // pickTheme() mirror: honor a stored live id, else the dark default. 'default'
      // is retired (migrates to dark), so 'dark' is the only live stored id today.
      const stored = localStorage.getItem('logicweb.theme');
      document.documentElement.setAttribute('data-theme', stored === 'dark' ? stored : 'dark');
    } catch {
      // Storage unavailable (privacy mode): pickTheme's fallback is dark too.
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="transport" class="primary" data-i18n="toolbar.start" data-i18n-title="toolbar.startTitle" title="Start a capture on the connected device">Start</button>
      <button id="btn-open" data-i18n="toolbar.open" data-i18n-title="toolbar.openTitle" title="Load a sigrok .sr session or a .lwcap">Open…</button>
      <button id="btn-save" data-i18n="toolbar.save" data-i18n-title="toolbar.saveTitle" title="Save this capture as .lwcap">Save</button>
      <button id="btn-fit" data-i18n="toolbar.fit" data-i18n-title="toolbar.fitTitle" title="Zoom to the whole capture">Fit</button>
      <span id="capture-title">no capture</span>
      <span class="spacer"></span>
      <button id="btn-settings" data-i18n="settings.title" data-i18n-title="settings.titleHint" title="Language and display preferences" aria-controls="settings-menu" aria-expanded="false">Settings</button>
    </div>

    <div id="main">
      <div id="scroll-area">
        <div id="labels-col">
          <div id="labels-spacer"></div>
          <div id="channel-list"></div>
        </div>

        <div id="plot-col">
          <canvas id="axis"></canvas>
          <div id="plot">
            <div id="wave-stack"></div>
            <div id="empty-hint">
              <span data-i18n="emptyHint.line1">No capture loaded.</span><br />
              <span data-i18n="emptyHint.line2">Open a .sr or .lwcap file, or connect an SLogic16/32 U3.</span>
            </div>
          </div>
        </div>
      </div>

      <div id="side-panel"></div>

      <div id="rail">
        <button class="rail-btn" id="rail-device" data-i18n-title="rail.deviceTitle" title="Device and capture settings">◈</button>
        <button class="rail-btn" id="rail-analyzers" data-i18n-title="rail.analyzersTitle" title="Protocol analyzers">≡</button>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <input id="file-input" type="file" multiple hidden
         accept=".sr,.lwcap" />
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
